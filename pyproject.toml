[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "0xlog-cli"
version = "0.1.0"
authors = [
  { name="Soroosh Ghaffari", email="0xSoroosh@gmail.com" },
]
description = "A lightweight terminal time tracker with Git branch detection"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "productivity", "time-tracking", "terminal", "git", "tui", "timesheet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/0xSrsh/0xLog"
Repository = "https://github.com/0xSrsh/0xLog"
Issues = "https://github.com/0xSrsh/0xLog/issues"
Changelog = "https://github.com/0xSrsh/0xLog/releases"

# Terminal command is defined here
[project.scripts]
0xlog = "oxlog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
