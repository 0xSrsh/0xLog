name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/0xlog-cli
    permissions:
      # Required for PyPI Trusted Publishing; no API token is stored anywhere.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Install package
        run: python -m pip install .
      # A tag push does not match the CI workflow triggers, so run the suite here
      # to keep an untested commit from reaching PyPI, where versions are permanent.
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
